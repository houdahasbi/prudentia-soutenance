body{display:grid;place-items:center;background:radial-gradient(1000px 600px at 80% -10%,#1b2f6b 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#2b1b6b 0,transparent 55%),#060b1a}

button{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;color:#04121a;background:linear-gradient(90deg,#2dd4bf,#a78bfa);cursor:pointer}

  var enc = new TextEncoder();
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  var keyP = null;
  function deriveKey(code){

    });
  }
  window.__videoUrl = function(){
    return keyP.then(function(k){
      return fetch('prudentia-demo.enc').then(function(r){ if(!r.ok) throw new Error('video'); return r.arrayBuffer(); }).then(function(buf){
        var u = new Uint8Array(buf);
        return crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, k, u.slice(12));
      }).then(function(plain){ return URL.createObjectURL(new Blob([plain], {type:'video/webm'})); });
    });

    err.textContent = ''; b.disabled = true; b.textContent = 'Vérification…';
    var p = deriveKey(code);

      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, k, b64(P.data)).then(function(plain){
